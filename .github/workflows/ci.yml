name: CI — Spark Experiments Integrity & Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check . --exit-zero

      - name: Run Integrity & Notebook Test Suite
        run: |
          python3 scripts/run_tests.py

      - name: Verify Git Hygiene
        run: |
          if git ls-files | grep -q '\.venv'; then
            echo "FAIL: .venv tracked in git index"
            exit 1
          fi
          if git ls-files | grep -q '\.parquet'; then
            echo "FAIL: .parquet files tracked in git index"
            exit 1
          fi
          echo "Git hygiene verified: No .venv or .parquet files in index."

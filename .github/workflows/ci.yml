name: Handbook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: santoshjammi29/.github/.github/workflows/handbook-ci.yml@v1
    with:
      # spark-experiments stores empirical Jupyter benchmark notebooks; enforce empty outputs/execution_count.
      allow_notebooks: true

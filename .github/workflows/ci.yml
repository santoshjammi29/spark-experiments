name: Handbook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: santoshjammi29/.github/.github/workflows/handbook-ci.yml@v1
    with:
      # Keep docs/images/*.png Spark UI screenshots (up to 1.2 MB) and cleared .ipynb benchmarks.
      max_file_kb: 1500
      allow_notebooks: true
